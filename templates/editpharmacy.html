```html
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Medicine - Pharmacy</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f6fb;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2563eb;
        }

        .back-btn {
            background: #2563eb;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 8px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .card h2 {
            color: #2563eb;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 13px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
        }

        .full {
            grid-column: 1 / 3;
        }

        .buttons {
            margin-top: 25px;
            display: flex;
            gap: 12px;
        }

        .update-btn {
            background: #16a34a;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .cancel-btn {
            background: #6b7280;
            color: white;
            text-decoration: none;
            padding: 13px 25px;
            border-radius: 8px;
            font-size: 16px;
        }

        .update-btn:hover {
            background: #15803d;
        }

        .cancel-btn:hover {
            background: #4b5563;
        }

        @media(max-width: 700px) {

            body {
                padding: 15px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: 1;
            }

            .card {
                padding: 20px;
            }

            .header {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>💊 Edit Medicine</h1>

        <a href="{{ url_for('pharmacy') }}" class="back-btn">
            ← Pharmacy
        </a>

    </div>


    <div class="card">

        <h2>✏️ Update Medicine Details</h2>

        <form method="POST"
              action="{{ url_for('edit_medicine', id=medicine.id) }}">

            <div class="form-grid">

                <!-- MEDICINE NAME -->
                <div>
                    <label>Medicine Name</label>

                    <input
                        type="text"
                        name="medicine_name"
                        value="{{ medicine.medicine_name }}"
                        required>
                </div>


                <!-- CATEGORY -->
                <div>

                    <label>Category</label>

                    <select name="category" required>

                        <option value="Tablet"
                            {% if medicine.category == "Tablet" %}selected{% endif %}>
                            Tablet
                        </option>

                        <option value="Syrup"
                            {% if medicine.category == "Syrup" %}selected{% endif %}>
                            Syrup
                        </option>

                        <option value="Injection"
                            {% if medicine.category == "Injection" %}selected{% endif %}>
                            Injection
                        </option>

                        <option value="Capsule"
                            {% if medicine.category == "Capsule" %}selected{% endif %}>
                            Capsule
                        </option>

                        <option value="Ointment"
                            {% if medicine.category == "Ointment" %}selected{% endif %}>
                            Ointment
                        </option>

                        <option value="Other"
                            {% if medicine.category == "Other" %}selected{% endif %}>
                            Other
                        </option>

                    </select>

                </div>


                <!-- STOCK -->
                <div>

                    <label>Stock Quantity</label>

                    <input
                        type="number"
                        name="stock_quantity"
                        min="0"
                        value="{{ medicine.stock_quantity }}"
                        required>

                </div>


                <!-- PRICE -->
                <div>

                    <label>Unit Price (₹)</label>

                    <input
                        type="number"
                        name="unit_price"
                        min="0"
                        step="0.01"
                        value="{{ medicine.unit_price }}"
                        required>

                </div>


                <!-- EXPIRY -->
                <div>

                    <label>Expiry Date</label>

                    <input
                        type="date"
                        name="expiry_date"
                        value="{{ medicine.expiry_date }}"
                        required>

                </div>


                <!-- SUPPLIER -->
                <div>

                    <label>Supplier</label>

                    <input
                        type="text"
                        name="supplier"
                        value="{{ medicine.supplier or '' }}"
                        placeholder="Enter supplier name">

                </div>

            </div>


            <div class="buttons">

                <button type="submit" class="update-btn">
                    💾 Update Medicine
                </button>

                <a href="{{ url_for('pharmacy') }}" class="cancel-btn">
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
```
