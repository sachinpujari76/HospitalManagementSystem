<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Patient</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        body {
            background: #f3f6fb;
            padding: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        h1 {
            color: #2563eb;
            margin-bottom: 25px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        .full {
            grid-column: 1 / 3;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            cursor: pointer;
            font-size: 16px;
        }

        .back {
            display: inline-block;
            margin-bottom: 20px;
            text-decoration: none;
            color: #2563eb;
        }

        @media(max-width: 700px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: 1;
            }

        }

    </style>

</head>


<body>

<div class="container">

    <a href="{{ url_for('patients') }}"
       class="back">

        ← Back to Patients

    </a>


    <h1>✏️ Edit Patient</h1>


    <form method="POST">

        <div class="form-grid">


            <input
                type="text"
                name="patient_name"
                value="{{ patient.patient_name }}"
                placeholder="Patient Name"
                required
            >


            <input
                type="number"
                name="age"
                value="{{ patient.age }}"
                placeholder="Age"
                required
            >


            <select name="gender" required>

                <option value="Male"
                    {% if patient.gender == "Male" %}selected{% endif %}>
                    Male
                </option>

                <option value="Female"
                    {% if patient.gender == "Female" %}selected{% endif %}>
                    Female
                </option>

                <option value="Other"
                    {% if patient.gender == "Other" %}selected{% endif %}>
                    Other
                </option>

            </select>


            <input
                type="text"
                name="phone"
                value="{{ patient.phone }}"
                placeholder="Phone"
                required
            >


            <input
                type="email"
                name="email"
                value="{{ patient.email or '' }}"
                placeholder="Email"
            >


            <input
                type="text"
                name="blood_group"
                value="{{ patient.blood_group or '' }}"
                placeholder="Blood Group"
            >


            <input
                type="text"
                name="disease"
                value="{{ patient.disease or '' }}"
                placeholder="Disease"
            >


            <input
                type="text"
                name="address"
                value="{{ patient.address or '' }}"
                placeholder="Address"
                class="full"
            >

        </div>


        <button type="submit">

            💾 Update Patient

        </button>

    </form>

</div>

</body>

</html>
